<style>
  :root {
    --bg: #fff; --bg-alt: #f5f5f7; --ink: #1d1d1f; --muted: #6e6e73; --dim: #86868b;
    --line: #d2d2d7; --line-2: #e8e8ed; --blue: #0071e3; --amber: #ff9f0a;
    --ease: cubic-bezier(.16,1,.3,1);
    --font: "SF Pro Display", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Helvetica Neue",
            "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    background: var(--bg); color: var(--ink); font-family: var(--font);
    font-size: 17px; line-height: 1.47; letter-spacing: 0;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }
  ::selection { background: rgba(0,113,227,.18); }
  a { color: inherit; text-decoration: none; }
  h1, h3, p { margin: 0; }

  .nav {
    position: sticky; top: 0; z-index: 10; height: 52px;
    background: rgba(255,255,255,.72);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid rgba(0,0,0,.08);
  }
  .nav-inner {
    max-width: 1120px; height: 100%; margin: 0 auto; padding: 0 24px;
    display: flex; align-items: center; gap: 28px;
  }
  .brand { display: flex; align-items: center; gap: 9px; }
  .brand img { width: 26px; height: 26px; border-radius: 7px; display: block; box-shadow: 0 1px 3px rgba(0,0,0,.16); }
  .brand span { font-size: 14px; font-weight: 600; letter-spacing: -.01em; }
  .brand em {
    font-style: normal; font-weight: 400; color: var(--dim); margin-left: 6px;
    font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
  }
  .nav-links { margin-left: auto; display: flex; align-items: center; gap: 26px; }
  .nav-links a { font-size: 12px; opacity: .82; transition: opacity .2s; }
  .nav-links a:hover { opacity: 1; }
  .nav-links .cta { color: var(--blue); opacity: 1; }

  main {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 96px 24px 48px;
  }
  .code {
    font-size: clamp(120px, 19vw, 210px); line-height: .82; letter-spacing: -.06em;
    font-weight: 600; color: #e9e9ee; user-select: none; margin-bottom: 14px;
    font-variant-numeric: tabular-nums;
  }
  h1 {
    font-size: clamp(30px, 4.2vw, 48px); line-height: 1.12; letter-spacing: -.025em;
    font-weight: 600; color: var(--ink);
  }
  .lead { margin-top: 16px; font-size: 17px; line-height: 1.6; color: var(--muted); }
  .actions { display: flex; align-items: center; gap: 24px; margin-top: 30px; flex-wrap: wrap; justify-content: center; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; height: 46px; padding: 0 24px;
    border-radius: 980px; background: var(--blue); color: #fff; font-size: 16px; font-weight: 500;
    transition: background .25s;
  }
  .btn:hover { background: #0077ed; }
  .link { display: inline-flex; align-items: center; gap: 4px; color: var(--blue); font-size: 16px; }
  .link:hover { text-decoration: underline; }
  .link svg { width: 15px; height: 15px; }

  .req {
    margin-top: 28px; display: inline-flex; align-items: center; gap: 8px; max-width: min(90vw, 560px);
    padding: 7px 13px; border: 1px solid var(--line-2); border-radius: 980px;
    font-family: var(--mono); font-size: 11.5px; color: var(--dim);
  }
  .req i { width: 6px; height: 6px; border-radius: 50%; background: var(--amber); flex-shrink: 0; }
  .req span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .cards {
    width: 100%; max-width: 980px; margin: 64px auto 0;
    display: grid; grid-template-columns: repeat(auto-fit, minmax(196px, 1fr)); gap: 16px;
    text-align: left;
  }
  .card {
    position: relative; display: block; padding: 22px 22px 24px; border-radius: 18px;
    background: var(--bg-alt); transition: transform .4s var(--ease), box-shadow .4s;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 16px 36px rgba(0,0,0,.08); }
  .card h3 { font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
  .card p { margin-top: 5px; font-size: 12.5px; line-height: 1.5; color: var(--muted); }
  .card .go {
    position: absolute; right: 20px; bottom: 20px; color: var(--blue);
    opacity: .18; transform: none; transition: opacity .3s, transform .3s;
  }
  .card .go svg { width: 14px; height: 14px; display: block; }
  .card:hover .go { opacity: 1; transform: translateX(2px); }

  footer {
    padding: 28px 24px 34px; text-align: center;
    font-size: 11px; color: var(--dim); line-height: 1.7;
  }
  .foot-line {
    display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
    gap: 6px 20px;
  }
  footer span, footer a { white-space: nowrap; }
  footer a { color: var(--muted); }
  footer a:hover { text-decoration: underline; }

  @media (max-width: 640px) {
    .nav-inner { padding: 0 20px; }
    .brand em { display: none; }
    main { padding: 64px 20px 36px; }
    .code { font-size: 128px; margin-bottom: 10px; }
    .lead { font-size: 15px; }
    .actions { width: 100%; flex-direction: column; gap: 16px; }
    .btn { width: 100%; }
    .cards { margin-top: 44px; grid-template-columns: 1fr 1fr; gap: 12px; }
    .card { padding: 18px; }
    .card .go { display: none; }
  }
  @media (max-width: 340px) {
    .cards { grid-template-columns: 1fr; }
  }
</style>
</head>
